name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed lib is up to date
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --short -- lib
            echo "::error::lib/ is stale; run pnpm build and commit the result."
            exit 1
          fi
